version: "3"
services:
  library-api:
    restart: always
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: library_mern_api
    volumes:
      - /app/node_modules
      - ./server:/app
    ports:
      - 5000:5000
    depends_on:
      - mongodb
    environment:
      NODE_ENV: development
      MONGO_URI: mongodb://root:rootpassword@mongodb
    networks:
      - library-mern-api

  mongodb:
    image: mongo
    restart: always
    container_name: mern_docker_demo-mongodb-1
    ports:
      - 27017:27017
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - ./mongodb_data:/data/db
    networks:
      - library-mern-api

  mongo-express:
    image: mongo-express
    container_name: mern_docker_demo-mongo-express-1
    restart: always
    depends_on:
      - mongodb
    ports:
      - 8081:8081
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: rootpassword
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123456
    networks:
      - library-mern-api

  client:
    restart: always
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: library_mern_frontend
    volumes:
      - /app/node_modules
      - ./client:/app
    depends_on:
      - library-api
    networks:
      - library-mern-api

  nginx:
    restart: always
    depends_on:
      - library-api
      - client
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: library_mern_nginx
    ports:
      - 8080:80
    networks:
      - library-mern-api

networks:
  library-mern-api:
    driver: bridge
